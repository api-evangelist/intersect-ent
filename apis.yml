name: Intersect ENT
description: 'Intersect ENT was a medical device company based in Menlo Park, California
  that developed drug-eluting, bioresorbable sinus implants for patients with chronic
  rhinosinusitis. Its PROPEL family of steroid-eluting implants maintains sinus patency
  and delivers localized mometasone furoate to the sinus mucosa following endoscopic
  sinus surgery, while its SINUVA implant treats recurrent nasal polyps in an in-office
  setting. Formerly publicly traded on NASDAQ under the ticker XENT, Intersect ENT
  was acquired by Medtronic in May 2022 and its PROPEL and SINUVA product lines are
  now sold as part of Medtronic''s ear, nose, and throat (ENT) portfolio. The company
  is a physical medical-device manufacturer and operates no public developer program,
  API, SDK, or documentation surface.'
